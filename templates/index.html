  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
	   background-color: black;
    }

    #container {
      display: flex;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    .side-panel {
      height: 100%;
      transition: width 0.3s;
      overflow: hidden;
      position: relative;
    }

    .left {
      width: 290px;
    }

    .right {
      width: 30%;
    }

    .collapsed {
      width: 0 !important;
    }

    .panel-iframe {
      border: none;
      width: 100%;
      height: 100%;
    }

    .main {
      flex: 1;
      height: 100%;
    }

    .toggle-button {
      position: absolute;
      top: 50%;
      width: 20px;
      height: 40px;
      background: rgba(0,0,0,0.3);
      color: white;
      border: none;
      cursor: pointer;
      z-index: 10;
    }

    .left .toggle-button {
      right: 0;
      border-radius: 0 5px 5px 0;
    }

    .right .toggle-button {
      left: 0;
      border-radius: 5px 0 0 5px;
    }

    .expand-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 40px;
      background: rgba(0, 0, 0, 0.4);
      color: white;
      border: none;
      cursor: pointer;
      z-index: 20;
      display: none;
      justify-content: center;
      align-items: center;
    }

    #leftExpand {
      left: 0;
      border-radius: 0 5px 5px 0;
    }

    #rightExpand {
      right: 0;
      border-radius: 5px 0 0 5px;
    }

    .show {
      display: flex !important;
    }
  </style>
</head>
<body>
  <div id="container">
    <div class="side-panel left" id="leftPanel">
      <button class="toggle-button" onclick="togglePanel('left')">&#10094;</button>
      <iframe id="treeview" class="panel-iframe" src="/treeview"></iframe>
    </div>

    <button id="leftExpand" class="expand-button" onclick="togglePanel('left')">&#10095;</button>

    <div class="main">
      <iframe id="3dview" class="panel-iframe" src="/map"></iframe>
    </div>

    <div class="side-panel right" id="rightPanel">
      <button class="toggle-button" onclick="togglePanel('right')">&#10095;</button>
      <iframe id="editor" class="panel-iframe" src="/edit"></iframe>
    </div>

    <button id="rightExpand" class="expand-button" onclick="togglePanel('right')">&#10094;</button>
  </div>

  <script>
    function togglePanel(side) {
      const panel = document.getElementById(side + 'Panel');
      const isCollapsed = panel.classList.toggle('collapsed');

      // Adjust toggle button arrow
      const btn = panel.querySelector('.toggle-button');
      if (side === 'left') {
        btn.innerHTML = isCollapsed ? '&#10095;' : '&#10094;';
      } else {
        btn.innerHTML = isCollapsed ? '&#10094;' : '&#10095;';
      }

      // Show/hide floating expand button
      document.getElementById(side + 'Expand').classList.toggle('show', isCollapsed);
    }
	
	// Pass initial hash to /map when main page loads
	window.addEventListener("DOMContentLoaded", () => {
	  const mapFrame = document.getElementById("3dview");
	  const initialHash = location.hash || "/system/stanton";

	  mapFrame.onload = () => {
		mapFrame.contentWindow.receiveHash(initialHash);
	  };
	});

	// Allow /map and /treeview to update the main URL hash
	function updateMainHash(newHash) {
		if (location.hash !== newHash) {
			location.hash = newHash;
		}
	}	
		
	function otherIframeFunction(data) {
		const editor = document.getElementById('editor');
		editor.contentWindow.receiveData(data); 
	}

  	function treeviewSelect(systemId) {
		const newHash = "#/system/" + systemId.replace(/^\/+/, '');
		
		//Send to /editor
		updateMainHash(newHash);

		// Send to /map
		const mapFrame = document.getElementById("3dview");
		if (mapFrame && mapFrame.contentWindow && mapFrame.contentWindow.receiveHash) {
			mapFrame.contentWindow.receiveHash(newHash);
		}
	}
	
	togglePanel('right');
	togglePanel('left');
	
  </script>
</body>
</html>
