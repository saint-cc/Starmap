function toggleFullscreen() {
    const elem = document.documentElement; // or renderer.domElement

    if (
        document.fullscreenElement ||
        document.webkitFullscreenElement || // Safari
        document.msFullscreenElement // IE
    ) {
        // Exit fullscreen
        if (document.exitFullscreen) {
            document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) {
            document.msExitFullscreen();
        }
    } else {
        // Enter fullscreen
        if (elem.requestFullscreen) {
            elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) { // Safari
            elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) { // IE
            elem.msRequestFullscreen();
        }
    }
}

<script>
// ######## GROUP CONNECT ########
const ID = "browser" + Math.floor(Math.random()*10000);
let GROUP_KEY;
let GROUP;

//const ws = new WebSocket("ws://172.16.3.35:8765");
let serverUrl = document.getElementById("signalserver").value || "ws://172.16.3.35:8765";
let ws = new WebSocket(serverUrl);

// Map of tool IDs to their positions
const overlay = document.getElementById("overlayDisplay");
const positions = {}; // filled by WS messages

function hashGroupName(name, key) {
    // Combine group name + key into one string
    const combined = name + key;

    // Hash it with CryptoJS
    return CryptoJS.SHA256(combined).toString();
}

document.getElementById("joinBtn").onclick = () => {
	serverUrl = document.getElementById("signalserver").value || "ws://172.16.3.35:8765";
	ws = new WebSocket(serverUrl);
	
    const keyInput = document.getElementById("groupKey").value;
    GROUP_KEY = keyFromString(keyInput);
    const plainGroup = document.getElementById("groupName").value;

    // Hash group name + key using CryptoJS
    GROUP = CryptoJS.SHA256(plainGroup + keyInput).toString();

	ws.onopen = () => {
		ws.send(JSON.stringify({type:"join_group", id:ID, group:GROUP}));
		retroLog(`Joined group ${plainGroup} as ${ID}`, consoleEl2);
	};
	
	    ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);

        if (msg.type === "pos_update") {
            if (!GROUP_KEY) return;

            const pos = decryptAES(msg.data, GROUP_KEY);
            if (pos) {
                positions[msg.id] = pos;
                renderUserList();
            }
        } else if (msg.type === "leave") {
            delete positions[msg.id];
            renderUserList();
        }
    };
	
    // UI still shows the plain group
    overlay.innerHTML = `<strong>Group: ${plainGroup}</strong><br><div id="userList"></div>`;
};

	// Need to reattach a click function
function attachJoinHandler() {
    const joinBtn = document.getElementById("joinBtn");
    if (!joinBtn) return;

    joinBtn.onclick = () => {
        const keyInput = document.getElementById("groupKey").value;
        GROUP_KEY = keyFromString(keyInput);
        const plainGroup = document.getElementById("groupName").value;

        // Hash group name + key
        GROUP = CryptoJS.SHA256(plainGroup + keyInput).toString();

        ws.send(JSON.stringify({ type: "join_group", id: ID, group: GROUP }));
        retroLog(`Joined group ${plainGroup} as ${ID}`, consoleEl2);

        // Show the user list in overlay
        const overlay = document.getElementById("overlayDisplay");
        overlay.innerHTML = `<strong>Group: ${plainGroup}</strong><br><div id="userList"></div>`;
        renderUserList(); // populate users
    };
}

function renderUserList() {
    const userListDiv = document.getElementById("userList");
    if (!userListDiv) return;
    userListDiv.innerHTML = ""; // clear previous

    // Disconnect button at the top
    const disconnectBtn = document.createElement("button");
    disconnectBtn.textContent = "Disconnect";
    disconnectBtn.onclick = () => {
        const overlay = document.getElementById("overlayDisplay");
        overlay.innerHTML = `
			<span>Open <a href="#" onclick="openPoller(); return false;">Poller</a> for use with /showlocation comamnd.</span><br>
            <br>
			<label>Name: <input id="signalserver" value="ws://172.16.3.35:8765"></label><br>
            <label>Name: <input id="groupName" value="alpha"></label><br>
            <label>Key : <input id="groupKey" type="password" placeholder="Enter key"></label><br>
			<button id="joinBtn">Join Group</button>
        `;
        attachJoinHandler(); // reattach join button handler
    };
    userListDiv.appendChild(disconnectBtn);

    // List all users
    for (const userId in positions) {
        const userData = positions[userId];
        const el = document.createElement("div");
        el.textContent = `${userId} (${userData.system || "unknown system"})`;
        userListDiv.appendChild(el);
    }
}

ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    if (msg.type === "pos_update") {
        if (!GROUP_KEY) return;

        const pos = decryptAES(msg.data, GROUP_KEY);
        if (pos) {
            positions[msg.id] = pos;
            renderUserList();
        }
    }

    else if (msg.type === "leave") {
        // Remove player from positions
        delete positions[msg.id];

        // Update overlay/user list
        renderUserList();
    }
};

// Convert string key to WordArray (CryptoJS)
function keyFromString(str){
    return CryptoJS.enc.Utf8.parse(str.padEnd(32, '\0').slice(0,32));
}

// Decrypt AES-CBC
function decryptAES(encryptedBase64, key){
    try {
        const encrypted = CryptoJS.enc.Base64.parse(encryptedBase64);
        const iv = CryptoJS.lib.WordArray.create(encrypted.words.slice(0, 4)); // 16 bytes
        const ciphertext = CryptoJS.lib.WordArray.create(encrypted.words.slice(4), encrypted.sigBytes - 16);
        const decrypted = CryptoJS.AES.decrypt({ciphertext: ciphertext}, key, {iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7});
        return JSON.parse(decrypted.toString(CryptoJS.enc.Utf8));
    } catch(e){
        console.error("Decryption failed", e);
        return null;
    }
}
